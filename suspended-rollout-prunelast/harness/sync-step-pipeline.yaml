# Harness pipeline that reproduces the *step-level* symptom:
#
#   1 application(s) not yet synced.
#   Error: waiting for healthy state of argoproj.io/Rollout/suspended-repro
#   Sync Status: Running
#   Health: Suspended
#
# Fill in the <PLACEHOLDER> values for your account. The Sync step config below is
# what matters:
#   - waitTillHealthy: false  -> matches the customer pipeline. See note below.
#   - failOnTimeout: false    -> forced: SyncRunnable.java:196-198 throws
#                                IllegalStateException if failOnTimeout is set
#                                while waitTillHealthy is not.
#   - timeout: 10m            -> keep short so the repro finishes fast
#
# IMPORTANT: waitTillHealthy is NOT required to reproduce this, and turning it off does
# NOT avoid it. waitTillHealthy is read in exactly one place — SyncRunnable.java:1035 —
# inside the isApplicationSyncComplete branch and gated on isSyncSuccess. This deadlock
# happens precisely because isApplicationSyncComplete is FALSE, so waitTillHealthy is
# never consulted at all. The wait is imposed by the Argo engine, not by Harness.
#
# The step therefore fails via the "still running" branch at SyncStep.java:147-155,
# not via the failOnTimeout branch at SyncStep.java:137-145.
#
# The step timeout is deliberately shorter than the Rollout's indefinite pause, so the
# poll loop in SyncRunnable.java:983-1129 is guaranteed to hit its deadline.
pipeline:
  name: suspended-rollout-prunelast-repro
  identifier: suspended_rollout_prunelast_repro
  projectIdentifier: <PROJECT_ID>
  orgIdentifier: <ORG_ID>
  tags: {}
  stages:
    - stage:
        name: sync-suspended-rollout
        identifier: sync_suspended_rollout
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: <SERVICE_REF>
          environment:
            environmentRef: <ENVIRONMENT_REF>
            deployToAll: false
            gitOpsClusters:
              - identifier: <CLUSTER_ID>
          execution:
            steps:
              - step:
                  type: GitOpsSync
                  name: Sync_Suspended_Rollout
                  identifier: Sync_Suspended_Rollout
                  timeout: 10m
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    # Both false, matching the customer pipeline. Neither is needed to
                    # reproduce the stall — see the header note.
                    waitTillHealthy: false
                    failOnTimeout: false
                    # Optional: set to RESUME to demonstrate the second defect — that
                    # auto-promote never fires here, because applyAutoPromoteBehavior
                    # is only reachable from inside the isApplicationSyncComplete +
                    # isSyncSuccess branch (SyncRunnable.java:1077, :1085), and the
                    # sync never reaches a terminal successful phase.
                    # autoPromoteRolloutBehavior: RESUME
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: true
                      pruneResourcesAtLast: true # PruneLast=true
                      applyOutOfSyncOnly: true
                      prunePropagationPolicy: foreground
                      replaceResources: false
            rollbackSteps: []
        # IMPORTANT: leave this as the default (fail the stage). The Box pipeline had
        # IgnoreFailed here, which is why the Sync step error was easy to overlook —
        # the pipeline actually died later, in verification.
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
